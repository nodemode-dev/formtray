[package]
name = "formai-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "FormAI's engine: the Form app registry, finding installed apps, opening, focusing and quitting them, running state, usage and preferences. No window."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
